# Conditions imported from the netns harness (name delay loss% bandwidth).
# Docker-only conditions can be added with: condition <name>|<netem rate delay [loss] [limit]>
conditions-file conditions.conf

video testdata/test_10s.mp4
duration 15
reps 3

[baseline]
conditions baseline lossy congested severe
strategies none
timeouts 0

[timeout-strategies]
conditions congested severe
strategies reset-stream reset-at-object reset-at-keyframe
timeouts 100ms 200ms
